name: Build image

# Every push to main builds ghcr.io/bond50/climate:<commit sha>.
# Deploying to siscom is a separate step: infra-siscom-v1 workflow "14j - Deploy Climate"
# with that tag. The Turnstile SITE key is public and baked in at build time (repository
# variable NEXT_PUBLIC_TURNSTILE_SITE_KEY); all secrets are runtime-only on the server.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-climate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Refuse data, dumps, keys and env files in the repo
        run: |
          bad=$(git ls-files | grep -iE '\.(csv|xlsx?|sql|sql\.gz|pem|key|p12|pfx)$|(^|/)\.env' || true)
          if [ -n "$bad" ]; then echo "::error::These files must never be in the repo:"; echo "$bad"; exit 1; fi

      - name: Site key present
        env:
          SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: '[ -n "$SITE_KEY" ] || { echo "::error::repository variable NEXT_PUBLIC_TURNSTILE_SITE_KEY is not set"; exit 1; }'

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/bond50/climate:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Image: ghcr.io/bond50/climate:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: infra-siscom-v1 -> Actions -> 14j - Deploy Climate (image_tag = ${GITHUB_SHA})" >> "$GITHUB_STEP_SUMMARY"
